name: Backend QA

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "scripts/**"
      - "tests/**"
      - "*.py"
      - "requirements.txt"
      - "docs/agentic/**"
      - ".github/workflows/backend-qa.yml"
    paths-ignore:
      - "app/data/**"
      - "app/data/tickets.db"
      - "app/data/wa_chats.db"
      - "app/data/*.json"
      - "app/data/*.db"
      - "log_cron.txt"
  pull_request:
    paths:
      - "app/**"
      - "scripts/**"
      - "tests/**"
      - "*.py"
      - "requirements.txt"
      - "docs/agentic/**"
      - ".github/workflows/backend-qa.yml"
    paths-ignore:
      - "app/data/**"
      - "log_cron.txt"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libsqlite3-dev \
            libglib2.0-0 \
            libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run smoke tests
        run: bash scripts/ci_backend_smoke.sh

      - name: Upload pytest log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-ci-log
          path: |
            pytest-ci.log
            pytest-results.xml
          if-no-files-found: ignore

      - name: Run script audit
        env:
          AGENTE_AUDITORIA_SKIP_WA: "1"
          AGENTE_AUDITORIA_CRON_QUIET: "1"
        run: python scripts/auditar_scripts_cron.py
